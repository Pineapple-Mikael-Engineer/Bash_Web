name: Upload Preview Deployment
on:
  workflow_run:
    workflows: ["Build Preview Deployment"]
    types:
      - completed

permissions:
  actions: read
  deployments: write
  contents: read

jobs:
  deploy-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    name: Deploy Preview to Cloudflare Pages
    steps:
      - name: Download build artifact
        id: preview-build-artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: preview-build
        run: |
          set -euo pipefail

          artifacts_url="https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts"
          artifact_id="$(curl -sSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${artifacts_url}" | python3 -c "import json,sys; data=json.load(sys.stdin); print(next((str(a['id']) for a in data.get('artifacts', []) if a.get('name') == '${ARTIFACT_NAME}'), ''))")"

          if [ -z "${artifact_id}" ]; then
            echo "Artifact '${ARTIFACT_NAME}' not found for run ${RUN_ID}" >&2
            exit 1
          fi

          curl -sSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o preview-build.zip

          mkdir -p build
          unzip -q preview-build.zip -d build
          echo "download-path=build" >> "${GITHUB_OUTPUT}"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          npx wrangler@4 pages deploy "${{ steps.preview-build-artifact.outputs.download-path }}" \
            --project-name quartz \
            --branch "${BRANCH_NAME}"
